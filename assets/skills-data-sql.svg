<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200" viewBox="0 0 380 200">
  <rect width="380" height="200" fill="#161b22" rx="8"/>
  <rect x="1" y="1" width="378" height="198" rx="7" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- dot + title -->
  <circle cx="20" cy="22" r="5" fill="#1D9E75"/>
  <text x="32" y="27" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#5DCAA5" letter-spacing="1">DATA &amp; SQL</text>

  <!-- divider -->
  <line x1="16" y1="36" x2="364" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- SQL Server -->
  <text x="16" y="60" font-family="'Courier New',monospace" font-size="11" fill="#c9d1d9">SQL Server</text>
  <rect x="150" y="51" width="170" height="6" rx="3" fill="#21262d"/>
  <rect x="150" y="51" width="157" height="6" rx="3" fill="#1D9E75"/>
  <text x="328" y="60" font-family="'Courier New',monospace" font-size="10" fill="#5DCAA5">strong</text>

  <!-- PostgreSQL -->
  <text x="16" y="88" font-family="'Courier New',monospace" font-size="11" fill="#c9d1d9">PostgreSQL</text>
  <rect x="150" y="79" width="170" height="6" rx="3" fill="#21262d"/>
  <rect x="150" y="79" width="140" height="6" rx="3" fill="#1D9E75"/>
  <text x="328" y="88" font-family="'Courier New',monospace" font-size="10" fill="#5DCAA5">strong</text>

  <!-- Metabase -->
  <text x="16" y="116" font-family="'Courier New',monospace" font-size="11" fill="#c9d1d9">Metabase</text>
  <rect x="150" y="107" width="170" height="6" rx="3" fill="#21262d"/>
  <rect x="150" y="107" width="145" height="6" rx="3" fill="#1D9E75"/>
  <text x="328" y="116" font-family="'Courier New',monospace" font-size="10" fill="#5DCAA5">strong</text>

  <!-- Reporting -->
  <text x="16" y="144" font-family="'Courier New',monospace" font-size="11" fill="#c9d1d9">Reporting</text>
  <rect x="150" y="135" width="170" height="6" rx="3" fill="#21262d"/>
  <rect x="150" y="135" width="150" height="6" rx="3" fill="#1D9E75"/>
  <text x="328" y="144" font-family="'Courier New',monospace" font-size="10" fill="#5DCAA5">strong</text>

  <!-- Data validation -->
  <text x="16" y="172" font-family="'Courier New',monospace" font-size="11" fill="#c9d1d9">Data validation</text>
  <rect x="150" y="163" width="170" height="6" rx="3" fill="#21262d"/>
  <rect x="150" y="163" width="143" height="6" rx="3" fill="#1D9E75"/>
  <text x="328" y="172" font-family="'Courier New',monospace" font-size="10" fill="#5DCAA5">strong</text>
</svg>
